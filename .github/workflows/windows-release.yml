name: Windows downloads

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-v1.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --prefix shared
          if ($LASTEXITCODE -ne 0) { throw 'Shared dependency installation failed' }
          npm ci --prefix host-app
          if ($LASTEXITCODE -ne 0) { throw 'Host dependency installation failed' }
          npm ci --prefix client-app
          if ($LASTEXITCODE -ne 0) { throw 'Client dependency installation failed' }
      - name: Build Windows applications
        shell: pwsh
        run: |
          npm run dist:all
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Prepare downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path downloads | Out-Null
          Copy-Item -LiteralPath host-app/release/ParallelBrowser-Host-Setup.exe -Destination downloads/
          Copy-Item -LiteralPath client-app/release/ParallelBrowser-Client-Setup.exe -Destination downloads/
          Copy-Item -LiteralPath client-app/release/ParallelBrowser-Client-Portable.exe -Destination downloads/
          Get-ChildItem downloads/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath downloads/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ParallelBrowser-Windows-x64
          path: downloads/*
      - name: Publish direct downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 downloads/ParallelBrowser-Host-Setup.exe downloads/ParallelBrowser-Client-Setup.exe downloads/ParallelBrowser-Client-Portable.exe downloads/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "ParallelBrowser 1.1.0 — Windows downloads" --notes-file docs/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation or asset upload failed; existing releases are not overwritten' }
          gh release edit v1.1.0 --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
