appId: com.parallelbrowser.client
productName: ParallelBrowser Client
directories:
  output: release
files:
  - package.json
  - dist/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  artifactName: "ParallelBrowser-Client-Setup.exe"
portable:
  artifactName: "ParallelBrowser-Client-Portable.exe"
