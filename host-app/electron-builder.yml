appId: com.parallelbrowser.host
productName: ParallelBrowser Host
directories:
  output: release
files:
  - package.json
  - dist/**/*
extraResources:
  - from: vendor/cloudflared.exe
    to: tools/cloudflared.exe
  - from: third-party
    to: third-party
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "ParallelBrowser-Host-Setup.exe"
